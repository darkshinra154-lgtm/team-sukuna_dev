<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUKUNA | ربط بكود Pair</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #8b0000;
  --secondary: #dc143c;
  --gold: #ffd700;
  --dark: #0a0a0a;
  --card-bg: rgba(20, 0, 0, 0.85);
  --text: #f5f5f5;
  --muted: #888;
  --border: rgba(139, 0, 0, 0.3);
  --success: #00c851;
  --error: #ff4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #000 0%, #1a0000 50%, #0a0a0a 100%);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(139, 0, 0, 0.2) 0%, transparent 50%);
  z-index: -1;
}

.container {
  max-width: 600px;
  width: 100%;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--gold);
  text-decoration: none;
  margin-bottom: 2rem;
  font-weight: 600;
  transition: all 0.3s;
}

.back-btn:hover { transform: translateX(5px); }

.main-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 3rem 2rem;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(139, 0, 0, 0.3);
  position: relative;
  overflow: hidden;
}

.main-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
  animation: rotate 30s linear infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.logo-section {
  text-align: center;
  margin-bottom: 2rem;
  position: relative;
  z-index: 1;
}

.logo-section .icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
  font-size: 2.5rem;
  box-shadow: 0 0 30px rgba(220, 20, 60, 0.5);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 30px rgba(220, 20, 60, 0.5); }
  50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
}

.logo-section h1 {
  font-size: 2rem;
  background: linear-gradient(90deg, var(--gold), #fff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}

.logo-section p {
  color: var(--muted);
}

.form-group {
  margin-bottom: 1.5rem;
  position: relative;
  z-index: 1;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: var(--gold);
}

.form-group input {
  width: 100%;
  padding: 1rem 1.2rem;
  background: rgba(0, 0, 0, 0.5);
  border: 2px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 1.1rem;
  font-family: inherit;
  transition: all 0.3s;
  direction: ltr;
  text-align: right;
}

.form-group input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
}

.submit-btn {
  width: 100%;
  padding: 1.2rem;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(220, 20, 60, 0.4);
}

.submit-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.result-box {
  margin-top: 2rem;
  padding: 2rem;
  background: rgba(0, 0, 0, 0.6);
  border: 2px solid var(--border);
  border-radius: 15px;
  display: none;
  position: relative;
  z-index: 1;
}

.result-box.show {
  display: block;
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-box.success { border-color: var(--success); }
.result-box.error { border-color: var(--error); }

.code-display {
  background: rgba(255, 215, 0, 0.1);
  border: 2px dashed var(--gold);
  padding: 1.5rem;
  border-radius: 12px;
  text-align: center;
  margin: 1rem 0;
  font-size: 2.5rem;
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--gold);
  font-family: 'Courier New', monospace;
  direction: ltr;
}

.copy-btn {
  background: var(--gold);
  color: var(--dark);
  padding: 0.8rem 1.5rem;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 1rem;
  transition: all 0.3s;
}

.copy-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
}

.steps {
  background: rgba(0, 0, 0, 0.4);
  padding: 1.5rem;
  border-radius: 12px;
  margin-top: 1rem;
}

.steps h3 {
  color: var(--gold);
  margin-bottom: 1rem;
  font-size: 1.1rem;
}

.steps ol {
  padding-right: 1.5rem;
  line-height: 2;
}

.steps li { color: var(--muted); }
.steps li strong { color: var(--text); }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.alert {
  padding: 1rem;
  border-radius: 10px;
  margin-top: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.alert-info { background: rgba(0, 123, 255, 0.1); border: 1px solid rgba(0, 123, 255, 0.3); color: #6ab7ff; }
.alert-success { background: rgba(0, 200, 81, 0.1); border: 1px solid rgba(0, 200, 81, 0.3); color: var(--success); }
.alert-error { background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.3); color: var(--error); }
</style>
</head>
<body>

<div class="container">
  <a href="/" class="back-btn">
    <i class="fas fa-arrow-right"></i>
    العودة للرئيسية
  </a>

  <div class="main-card">
    <div class="logo-section">
      <div class="icon">
        <i class="fas fa-key"></i>
      </div>
      <h1>🔢 ربط بكود Pair</h1>
      <p>أدخل رقم واتساب للحصول على كود الربط</p>
    </div>

    <form id="pairForm">
      <div class="form-group">
        <label><i class="fas fa-phone"></i> رقم الواتساب (بدون +)</label>
        <input type="tel" id="phoneInput" placeholder="201012345678" required 
               pattern="[0-9]{8,15}" maxlength="15" autocomplete="off">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <i class="fas fa-bolt"></i>
        <span id="btnText">توليد كود الربط</span>
      </button>
    </form>

    <div id="resultBox" class="result-box"></div>
  </div>
</div>

<script>
const form = document.getElementById('pairForm');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');
const resultBox = document.getElementById('resultBox');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const number = document.getElementById('phoneInput').value.trim();
  
  if (!/^[0-9]{8,15}$/.test(number)) {
    showError('الرقم غير صحيح. أدخل رقم دولي بدون + أو مسافات');
    return;
  }

  submitBtn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> جاري التوليد...';
  resultBox.className = 'result-box';
  resultBox.style.display = 'none';

  try {
    const response = await fetch(`/pair?number=${encodeURIComponent(number)}`);
    const data = await response.json();

    if (data.success && data.code) {
      showSuccess(data.code, data.number);
    } else {
      showError(data.message || 'فشل توليد الكود');
    }
  } catch (error) {
    showError('خطأ في الاتصال بالسيرفر: ' + error.message);
  } finally {
    submitBtn.disabled = false;
    btnText.innerHTML = '<i class="fas fa-bolt"></i> توليد كود الربط';
  }
});

function showSuccess(code, number) {
  resultBox.className = 'result-box success show';
  resultBox.innerHTML = `
    <div class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      <strong>تم التوليد بنجاح!</strong>
    </div>
    
    <div class="code-display" id="codeDisplay">${code}</div>
    
    <div style="text-align: center;">
      <button class="copy-btn" onclick="copyCode()">
        <i class="fas fa-copy"></i>
        نسخ الكود
      </button>
    </div>
    
    <div class="steps">
      <h3><i class="fas fa-list-ol"></i> خطوات الربط:</h3>
      <ol>
        <li>افتح <strong>واتساب</strong> على هاتفك</li>
        <li>اذهب إلى <strong>الإعدادات</strong> ← <strong>الأجهزة المرتبطة</strong></li>
        <li>اضغط <strong>"ربط جهاز"</strong></li>
        <li>اختر <strong>"الربط برقم الهاتف بدل الكود"</strong></li>
        <li>أدخل الكود أعلاه</li>
        <li>انتظر حتى يتم الحفظ في المنصة (تلقائي)</li>
      </ol>
    </div>
    
    <div class="alert alert-info" style="margin-top: 1rem;">
      <i class="fas fa-info-circle"></i>
      <small>الكود صالح لمدة قصيرة فقط. بعد الربط الناجح، سيتم حفظ الجلسة تلقائياً في المنصة.</small>
    </div>
  `;
}

function showError(message) {
  resultBox.className = 'result-box error show';
  resultBox.innerHTML = `
    <div class="alert alert-error">
      <i class="fas fa-exclamation-triangle"></i>
      <strong>${message}</strong>
    </div>
  `;
}

function copyCode() {
  const code = document.getElementById('codeDisplay').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = event.target.closest('.copy-btn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
    setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
  });
}
</script>

</body>
</html>
