<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SUKUNA | الجلسات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #8b0000; --secondary: #dc143c; --gold: #ffd700; --dark: #0a0a0a; --card-bg: rgba(20,0,0,0.85); --text: #f5f5f5; --muted: #888; --border: rgba(139,0,0,0.3); --success: #00c851; --error: #ff4444; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
body { min-height: 100vh; background: linear-gradient(135deg, #000 0%, #1a0000 50%, #0a0a0a 100%); color: var(--text); padding: 2rem; }
.container { max-width: 1200px; margin: 0 auto; }
.back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--gold); text-decoration: none; margin-bottom: 2rem; font-weight: 600; }
h1 { font-size: 2.5rem; margin-bottom: 2rem; background: linear-gradient(90deg, var(--gold), #fff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.stat { background: var(--card-bg); padding: 1.5rem; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
.stat-value { font-size: 2rem; font-weight: 900; color: var(--gold); }
.stat-label { color: var(--muted); font-size: 0.9rem; }
.sessions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.session-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; padding: 1.5rem; position: relative; transition: all 0.3s; }
.session-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 15px 40px rgba(139,0,0,0.3); }
.session-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; }
.session-number { font-size: 1.3rem; font-weight: 700; color: var(--gold); direction: ltr; text-align: right; }
.session-name { color: var(--muted); margin-top: 0.5rem; }
.delete-btn { background: var(--error); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; font-weight: 600; transition: all 0.3s; width: 100%; }
.delete-btn:hover { background: #cc0000; }
.empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
.refresh-btn { background: var(--gold); color: var(--dark); border: none; padding: 0.8rem 1.5rem; border-radius: 10px; cursor: pointer; font-weight: 700; margin-bottom: 2rem; display: inline-flex; align-items: center; gap: 0.5rem; }
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-btn"><i class="fas fa-arrow-right"></i> العودة</a>
  <h1>📂 إدارة الجلسات</h1>
  
  <button class="refresh-btn" onclick="loadSessions()">
    <i class="fas fa-sync"></i> تحديث
  </button>
  
  <div class="stats" id="stats"></div>
  <div class="sessions-grid" id="sessionsGrid"></div>
</div>

<script>
async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    const data = await res.json();
    
    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <div class="stat-value">${data.count}</div>
        <div class="stat-label">إجمالي الجلسات</div>
      </div>
      <div class="stat">
        <div class="stat-value">${data.sessions.filter(s => s.registered).length}</div>
        <div class="stat-label">مسجلة</div>
      </div>
    `;
    
    if (data.sessions.length === 0) {
      document.getElementById('sessionsGrid').innerHTML = `
        <div class="empty" style="grid-column: 1/-1;">
          <i class="fas fa-inbox" style="font-size: 4rem; color: var(--muted);"></i>
          <h3 style="margin: 1rem 0;">لا توجد جلسات حالياً</h3>
          <p>ابدأ بربط بوت جديد من صفحة Pair أو QR</p>
        </div>
      `;
      return;
    }
    
    document.getElementById('sessionsGrid').innerHTML = data.sessions.map(s => `
      <div class="session-card">
        <div class="session-icon">
          <i class="fas fa-mobile-alt"></i>
        </div>
        <div class="session-number">${s.number}</div>
        <div class="session-name">${s.name || 'بدون اسم'}</div>
        <button class="delete-btn" onclick="deleteSession('${s.number}')">
          <i class="fas fa-trash"></i> حذف
        </button>
      </div>
    `).join('');
  } catch (e) {
    alert('فشل تحميل الجلسات: ' + e.message);
  }
}

async function deleteSession(number) {
  if (!confirm(`هل تريد حذف جلسة ${number}؟`)) return;
  try {
    const res = await fetch(`/api/session/${number}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      loadSessions();
    } else {
      alert(data.message);
    }
  } catch (e) {
    alert('فشل الحذف: ' + e.message);
  }
}

loadSessions();
</script>
</body>
</html>
