<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUKUNA | ربط بكود QR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #8b0000;
  --secondary: #dc143c;
  --gold: #ffd700;
  --dark: #0a0a0a;
  --card-bg: rgba(20, 0, 0, 0.85);
  --text: #f5f5f5;
  --muted: #888;
  --border: rgba(139, 0, 0, 0.3);
  --success: #00c851;
  --error: #ff4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #000 0%, #1a0000 50%, #0a0a0a 100%);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 70% 30%, rgba(139, 0, 0, 0.2) 0%, transparent 50%);
  z-index: -1;
}

.container { max-width: 600px; width: 100%; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--gold);
  text-decoration: none;
  margin-bottom: 2rem;
  font-weight: 600;
  transition: all 0.3s;
}

.back-btn:hover { transform: translateX(5px); }

.main-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 3rem 2rem;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(139, 0, 0, 0.3);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.main-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
  animation: rotate 30s linear infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.logo-section { margin-bottom: 2rem; position: relative; z-index: 1; }

.logo-section .icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
  font-size: 2.5rem;
  box-shadow: 0 0 30px rgba(220, 20, 60, 0.5);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 30px rgba(220, 20, 60, 0.5); }
  50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
}

.logo-section h1 {
  font-size: 2rem;
  background: linear-gradient(90deg, var(--gold), #fff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}

.generate-btn {
  padding: 1.2rem 2rem;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 2rem;
}

.generate-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(220, 20, 60, 0.4);
}

.generate-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.qr-container {
  background: white;
  padding: 2rem;
  border-radius: 15px;
  display: none;
  margin: 0 auto;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(255, 215, 0, 0.2);
  position: relative;
  z-index: 1;
}

.qr-container.show {
  display: block;
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.qr-container img {
  width: 100%;
  height: auto;
  display: block;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: rgba(255, 215, 0, 0.1);
  border: 1px solid var(--gold);
  border-radius: 20px;
  color: var(--gold);
  font-weight: 600;
  margin-top: 1rem;
  position: relative;
  z-index: 1;
}

.status-badge .dot {
  width: 8px;
  height: 8px;
  background: var(--gold);
  border-radius: 50%;
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.steps {
  background: rgba(0, 0, 0, 0.4);
  padding: 1.5rem;
  border-radius: 12px;
  margin-top: 2rem;
  text-align: right;
  position: relative;
  z-index: 1;
}

.steps h3 {
  color: var(--gold);
  margin-bottom: 1rem;
  font-size: 1.1rem;
}

.steps ol {
  padding-right: 1.5rem;
  line-height: 2;
}

.steps li { color: var(--muted); }
.steps li strong { color: var(--text); }

.alert {
  padding: 1rem;
  border-radius: 10px;
  margin-top: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  position: relative;
  z-index: 1;
}

.alert-info { background: rgba(0, 123, 255, 0.1); border: 1px solid rgba(0, 123, 255, 0.3); color: #6ab7ff; }
.alert-success { background: rgba(0, 200, 81, 0.1); border: 1px solid rgba(0, 200, 81, 0.3); color: var(--success); }
.alert-error { background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.3); color: var(--error); }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

#resultMessage { margin-top: 1rem; }
</style>
</head>
<body>

<div class="container">
  <a href="/" class="back-btn">
    <i class="fas fa-arrow-right"></i>
    العودة للرئيسية
  </a>

  <div class="main-card">
    <div class="logo-section">
      <div class="icon">
        <i class="fas fa-qrcode"></i>
      </div>
      <h1>🔳 ربط بكود QR</h1>
      <p>امسح الكود بكاميرا واتساب للربط السريع</p>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateQR()">
      <i class="fas fa-qrcode"></i>
      <span id="btnText">توليد كود QR</span>
    </button>

    <div class="qr-container" id="qrContainer">
      <img id="qrImage" alt="QR Code">
    </div>

    <div id="statusBadge" style="display: none;" class="status-badge">
      <span class="dot"></span>
      <span>انتظار المسح...</span>
    </div>

    <div id="resultMessage"></div>

    <div class="steps">
      <h3><i class="fas fa-list-ol"></i> خطوات الربط:</h3>
      <ol>
        <li>افتح <strong>واتساب</strong> على هاتفك</li>
        <li>اذهب إلى <strong>الإعدادات</strong> ← <strong>الأجهزة المرتبطة</strong></li>
        <li>اضغط <strong>"ربط جهاز"</strong></li>
        <li>وجّه كاميرا الهاتف لمسح الكود أعلاه</li>
        <li>انتظر حتى يتم الحفظ في المنصة (تلقائي)</li>
      </ol>
    </div>
  </div>
</div>

<script>
const generateBtn = document.getElementById('generateBtn');
const btnText = document.getElementById('btnText');
const qrContainer = document.getElementById('qrContainer');
const qrImage = document.getElementById('qrImage');
const statusBadge = document.getElementById('statusBadge');
const resultMessage = document.getElementById('resultMessage');

async function generateQR() {
  generateBtn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> جاري التوليد...';
  qrContainer.classList.remove('show');
  statusBadge.style.display = 'none';
  resultMessage.innerHTML = '';

  try {
    const response = await fetch('/qr');
    const data = await response.json();

    if (data.success && data.qr) {
      qrImage.src = data.qr;
      qrContainer.classList.add('show');
      statusBadge.style.display = 'inline-flex';
      resultMessage.innerHTML = `
        <div class="alert alert-success">
          <i class="fas fa-check-circle"></i>
          <strong>تم التوليد! امسح الكود الآن.</strong>
        </div>
        <div class="alert alert-info" style="margin-top: 0.5rem;">
          <i class="fas fa-clock"></i>
          <small>الكود صالح لمدة 60 ثانية فقط</small>
        </div>
      `;
      
      // التحقق من نجاح الربط كل 5 ثواني
      startConnectionCheck();
    } else {
      resultMessage.innerHTML = `
        <div class="alert alert-error">
          <i class="fas fa-exclamation-triangle"></i>
          <strong>${data.message || 'فشل التوليد'}</strong>
        </div>
      `;
    }
  } catch (error) {
    resultMessage.innerHTML = `
      <div class="alert alert-error">
        <i class="fas fa-exclamation-triangle"></i>
        <strong>خطأ: ${error.message}</strong>
      </div>
    `;
  } finally {
    generateBtn.disabled = false;
    btnText.innerHTML = '<i class="fas fa-qrcode"></i> توليد كود QR';
  }
}

let checkInterval = null;
function startConnectionCheck() {
  if (checkInterval) clearInterval(checkInterval);
  
  let attempts = 0;
  const maxAttempts = 30; // 5 دقائق
  
  checkInterval = setInterval(async () => {
    attempts++;
    try {
      const res = await fetch('/api/stats');
      const data = await res.json();
      if (data.success) {
        console.log(`Check ${attempts}: ${data.data.totalSessions} sessions`);
      }
    } catch (e) {}
    
    if (attempts >= maxAttempts) {
      clearInterval(checkInterval);
      statusBadge.innerHTML = '<i class="fas fa-clock"></i> انتهت المهلة';
      statusBadge.style.color = 'var(--error)';
      statusBadge.style.borderColor = 'var(--error)';
    }
  }, 10000);
}

window.addEventListener('beforeunload', () => {
  if (checkInterval) clearInterval(checkInterval);
});
</script>

</body>
</html>
